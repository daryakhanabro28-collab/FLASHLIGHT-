name: Build & Release Debug APK

on:
  push:
    branches: [ '**' ] # Triggers on any branch pushed
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish APK to Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore & Environment
        run: |
          # Create .env to satisfy secrets gradle plugin
          touch .env
          
          # Setup debug keystore
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating fresh debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Make gradlew executable
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/UV-Privacy-v1.0-debug.apk
          ls -lh release-assets/

      - name: Upload Artifact (Backup in Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: UV-Privacy-Debug-APK
          path: release-assets/UV-Privacy-v1.0-debug.apk
          retention-days: 30

      - name: Publish Direct to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0-debug"
          RELEASE_TITLE="UV PRIVACY v1.0 (Debug APK)"
          
          # Verify file exists
          if [ ! -f "release-assets/UV-Privacy-v1.0-debug.apk" ]; then
            echo "Error: APK not found!"
            exit 1
          fi

          echo "Publishing to GitHub Releases using GitHub CLI..."
          
          # If release exists, upload/clobber asset; otherwise create fresh release
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Uploading new APK asset..."
            gh release upload "$TAG_NAME" release-assets/UV-Privacy-v1.0-debug.apk --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" release-assets/UV-Privacy-v1.0-debug.apk \
              --title "$RELEASE_TITLE" \
              --notes "## 🛡️ UV PRIVACY — Advanced Stealth Vault & Utility Suite
          **Created by:** Darya Khan abro (team Mr Pro PrimeX)

          ### 📲 Direct APK Download (No Unzipping Needed):
          Click on **\`UV-Privacy-v1.0-debug.apk\`** below in the **Assets** section to download directly to your Android device.

          ### ✨ Key Features:
          - **Stealth Disguise:** Real Digital Clock & Flashlight utility suites.
          - **Encrypted Media Vault:** AES-256-GCM private vault with native video player.
          - **Gallery Auto-Cleaner:** Prompt to delete unencrypted original files from device.
          - **Flashlight Secret Entry:** Drag brightness slider to 77% to trigger secret vault.
          - **Display Sounds & Haptics:** Audio tones for keypad, flashlight, and lock/unlock." \
              --latest
          fi

          echo "Release published successfully!"
